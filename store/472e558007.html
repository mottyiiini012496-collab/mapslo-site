<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>プレスト平間店II｜まぷスロ</title>
<meta name="description" content="まぷスロ｜パチスロ店の強い日と抽選方式がわかる地図">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--brand:#ff5a5f;--brand2:#ffb400;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111827;--ink:#e5e7eb;--sub:#94a3b8;--line:#1f2937}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px;line-height:1.6}
a{color:inherit}
header{position:sticky;top:0;z-index:1000;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo i{font-style:normal;color:var(--brand)}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:999px;color:var(--sub)}
nav a.on{background:var(--ink);color:var(--card)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 8px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--sub);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
#map{height:62vh;min-height:360px;border-radius:14px;border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.lk{display:inline-block;flex-shrink:0;white-space:nowrap;align-self:flex-start;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;margin-right:4px}
.pop b{font-size:14px}.pop .st{font-weight:900;font-size:16px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--card)}
.btn.brand{background:var(--brand);color:#fff}
.list .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.list .row:last-child{border-bottom:none}
.rk{width:26px;text-align:center;font-weight:900;color:var(--sub)}
.sv{margin-left:auto;font-weight:900;white-space:nowrap}
.tbl{overflow-x:auto}table{border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:center;white-space:nowrap}
th.n,td.n{text-align:left;position:sticky;left:0;background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
td.h{width:26px;height:24px;border-radius:4px}
.sat{color:#2563eb}.sun{color:#dc2626}
.lock{border:2px dashed var(--brand2);border-radius:14px;padding:14px;text-align:center}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip div{border-radius:8px;padding:5px 0;text-align:center;font-size:10.5px;min-width:0;line-height:1.35}
input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px}
footer{max-width:1100px;margin:0 auto;padding:16px;color:var(--sub);font-size:11.5px}
</style></head><body>
